[project]
name = "ai-image-studio"
version = "1.0.0"
description = "AI Image Studio Flask Application"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.1",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Migrate==4.1.0",
    "Flask-Login==0.6.3",
    "python-dotenv==1.1.0",
    "marshmallow==3.26.1",
    "Werkzeug==3.1.3",
    "gunicorn==23.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "opencv-python-headless>=4.8.0",
    "requests>=2.31.0",
    "rembg>=2.0.50",
    "onnxruntime>=1.16.0",
    "qrcode[pil]>=7.4",
]

[tool.setuptools]
packages = []
py-modules = []

[tool.vercel]
entrypoint = "run:app"
